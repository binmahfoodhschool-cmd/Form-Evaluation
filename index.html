<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تقييم الدورات التدريبية</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f7f3ee;--c:#fff;--t:#2a1520;--m:#7a6a70;--p:#6a1b3d;--g:#c9a24b;--b:#e6dccf;--r:#b3261e;--bt:#fff;--sel:#c9a24b;--selt:#1d1418;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1216;--c:#241a20;--t:#f1e7ea;--m:#b5a3aa;--p:#d98aa8;--g:#e0bb64;--b:#3b2c34;--r:#ef7b6d;--bt:#2a1520}}
:root[data-theme="dark"]{--bg:#1a1216;--c:#241a20;--t:#f1e7ea;--m:#b5a3aa;--p:#d98aa8;--g:#e0bb64;--b:#3b2c34;--r:#ef7b6d;--bt:#2a1520}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.7}
.w{max-width:900px;margin:0 auto;padding:16px}.card{background:var(--c);border:1px solid var(--b);border-top:3px solid var(--g);border-radius:10px;padding:16px;margin-bottom:14px}
h1{font-size:20px;margin:0 0 4px;color:var(--p)}h2{font-size:16px;margin:0 0 10px;color:var(--p)}.m{color:var(--m);font-size:13px}
input,textarea,select{width:100%;padding:8px;border:1px solid var(--b);border-radius:6px;background:var(--bg);color:var(--t);font:inherit}
button{background:var(--p);color:var(--bt);border:0;border-radius:6px;padding:8px 14px;font:inherit;cursor:pointer}button.s{background:transparent;color:var(--p);border:1px solid var(--g)}button.d{background:var(--r);color:#fff}button:disabled{opacity:.4}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{background:var(--c);color:var(--t);border:1px solid var(--b)}.tabs button.on{background:var(--p);color:var(--bt);border-color:var(--g)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.sc{overflow-x:auto}
.it{padding:10px 0;border-top:1px solid var(--b)}.rt{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rt label{flex:1;min-width:64px;text-align:center;border:1px solid var(--b);border-radius:6px;padding:6px;cursor:pointer;transition:.15s;border-bottom:4px solid var(--lc,var(--b))}.rt input{display:none}.rt label.on{background:var(--lc,var(--sel));color:var(--lt,var(--selt));border-color:var(--lc,var(--sel));font-weight:700;box-shadow:0 0 0 3px rgba(0,0,0,.14);transform:scale(1.04)}
.bar{background:var(--b);border-radius:4px;height:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--g))}
.req{color:var(--r)}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--b);padding:6px;text-align:right}
.row{display:flex;gap:8px;align-items:center;margin-bottom:6px}.row input[type=text]{flex:1}.row select{width:auto}
.err{color:var(--r);font-size:13px}.pie{width:150px;height:150px;border-radius:50%;flex:none}.lg{display:flex;gap:6px;align-items:center;font-size:14px}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}.qc{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.sb{display:grid;grid-template-columns:minmax(120px,1fr) 3fr 44px;gap:8px;align-items:center;margin:6px 0}
.ct{position:relative;width:1123px;height:794px;background:#fff;overflow:hidden;direction:ltr;color:#4a1230;font-family:Tahoma,Arial,sans-serif;border:1px solid var(--b)}
.ln{position:absolute;white-space:nowrap;line-height:1.25}.e{direction:ltr;font-family:"Times New Roman",serif;font-size:21px;color:#333}.ar{direction:rtl;font-size:22px;color:#333}
.f{display:inline-block;border-bottom:1.5px dotted #555;text-align:center;color:var(--fill);font-weight:700;font-family:Arial,Tahoma,sans-serif;overflow:hidden;white-space:nowrap;vertical-align:baseline;font-size:21px;line-height:1.2}
.cpk{display:flex;align-items:center;gap:8px}.cpk input{width:46px;height:34px;padding:0;border:0;background:none}.dz{cursor:move;outline:1px dashed rgba(201,162,75,.9);touch-action:none;user-select:none}.dz.sel{outline:2px solid #c9a24b;background:rgba(201,162,75,.15)}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--p);color:var(--bt);padding:10px 18px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.22);z-index:9999;font-size:14px;max-width:90vw;text-align:center}
.toast.errt{background:var(--r);color:#fff}
.mbk{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9998;padding:16px}
.mbox{background:var(--c);color:var(--t);border:1px solid var(--b);border-top:4px solid var(--g);border-radius:10px;padding:18px;max-width:400px;width:100%;box-shadow:0 12px 32px rgba(0,0,0,.25)}
.mbox h2{margin:0 0 8px}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:700}
.badge.ok{background:#e6f4ea;color:#137333}
.badge.warn{background:#fef7e0;color:#b06000}
.credit{max-width:900px;margin:6px auto 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--b);text-align:center;color:var(--m);font-size:13px;line-height:1.8}
.credit b{color:var(--p)}
@media print{.credit{display:none}}
</style></head><body><div class="w" id="app">جارٍ التحميل…</div>

async function gasGet(params){
  const u=getGasUrl();if(!u)throw new Error("لا يوجد رابط Google Apps Script");
  const q=new URLSearchParams(params).toString();
  const r=await fetch(u+(u.includes("?")?"&":"?")+q);
  if(!r.ok)throw new Error("HTTP "+r.status);
  return await r.json();
}
async function gasPost(payload){
  const u=getGasUrl();if(!u)throw new Error("لا يوجد رابط Google Apps Script");
  const r=await fetch(u,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return await r.json();
}

async function submit(){
  const f=cfg.form||{};
  if(closedNow()&&!mgr){draw();return}
  const nm=$("#nm").value.trim(),ne=$("#ne").value.trim(),a={},miss=[];
  const emEl=$("#em"),phEl=$("#ph"),em=emEl?emEl.value.trim():"",ph=phEl?phEl.value.trim():"";
  cfg.items.forEach(i=>{let v="";if(i.k=="r"){const x=document.querySelector(`input[name=${i.id}]:checked`);v=x?+x.value:""}else if(i.k=="t")v=$("#"+i.id).value.trim();
    if(i.k!="sec"){if(v!=="")a[i.id]=v;else if(i.req)miss.push(i.t)}});
  if(f.reqContact){if(phEl&&!ph)miss.unshift("رقم الجوال");if(emEl&&!em)miss.unshift("البريد الإلكتروني")}
  if(!nm)miss.unshift("الاسم بالعربية");
  if(miss.length){$("#er").textContent="بنود إلزامية لم تُعبَّأ: "+miss.slice(0,4).join("، ")+(miss.length>4?" …":"");return}
  if(!/^[A-Za-z][A-Za-z .'\-]+$/.test(ne)){$("#er").textContent="اكتب الاسم بالإنجليزية بحروف لاتينية فقط (مثال: Ahmed Omar Salem)";return}
  if(em&&!/^\S+@\S+\.\S+$/.test(em)){$("#er").textContent="البريد الإلكتروني غير صحيح";return}
  if(ph&&(!/^\+?[\d\s\-()]{7,20}$/.test(ph)||ph.replace(/\D/g,"").length<7)){$("#er").textContent="رقم الجوال غير صحيح (أرقام فقط، ويفضّل مع رمز الدولة)";return}
  const rec={name:nm,nameEn:ne,email:em,phone:ph,a,ts:editing?editing.ts:Date.now(),course:editing&&editing.course?{...editing.course}:{...cfg.course},items:cfg.items.map(({id,k,t})=>({id,k,t}))};
  const u=getGasUrl();
  if(editing){
    rec.id=editing.id;rec.et=editing.et;rec.edited=true;rec.editedAt=Date.now();
    try{
      if(u){
        const res=await gasPost({action:"editSubmit",id:rec.id,token:rec.et,rec});
        if(!res.ok){if(res.closed){cfg.form.closed=true;editing=null;draw();return}$("#er").textContent=res.error||"تعذر حفظ التعديل (تأكد من تحديث سكربت Google Apps Script ليدعم التعديل).";return}
      }else{const n=local.findIndex(x=>x.id==rec.id);if(n>=0)local[n]={...local[n],...rec};else local.push(rec);LS.s("ce_resp",local);resp=local}
    }catch(e){$("#er").textContent="تعذر حفظ التعديل: تحقق من الاتصال بالإنترنت.";return}
    LS.s(myKey(),{id:rec.id,edited:true,rec});mine=rec;editing=null;done=rec.id;draw();notify("تم تحديث ردك بنجاح");return;
  }
  rec.et="e"+Math.random().toString(36).slice(2)+Date.now().toString(36);
  try{
    if(u){
      const res=await gasPost({action:"submit",rec});
      if(!res.ok){
        if(res.closed){cfg.form.closed=true;if(res.error)cfg.form.closedMsg=res.error;draw();return}
        if(res.duplicate&&res.existingId){LS.s(subKey(),res.existingId);done=res.existingId;draw();notify(res.error||"تم تعبئة التقييم مسبقاً");return}
        $("#er").textContent=res.error||"تعذر الإرسال إلى Google Sheets";return
      }
      rec.id=res.id;resp.push(rec);
    }else{
      rec.id="l"+Date.now();local.push(rec);LS.s("ce_resp",local);resp=local;
    }
  }catch(e){$("#er").textContent="تعذر الإرسال: تحقق من الاتصال بالإنترنت ورابط Google Apps Script.";return}
  if(f.onceOnly!==false)LS.s(subKey(),rec.id);
  LS.s(myKey(),{id:rec.id,edited:false,rec:{name:nm,nameEn:ne,email:em,phone:ph,a,ts:rec.ts,et:rec.et,course:rec.course}});
  mine=rec;done=rec.id;draw();
}

function saveGasUrlInput(val){
  LS.s("ce_gas_url",val.trim());notify("تم حفظ رابط Google Apps Script محلياً، أعد تسجيل الدخول للمزامنة");draw();

async function refreshFromGas(){
  if(!getGasUrl()||!adminPass)return;
  try{
    const res=await gasPost({action:"login",password:adminPass});
    if(res.ok){if(res.cfg)cfg=mc(res.cfg);if(res.bgData!==undefined)bgData=res.bgData||"";resp=Array.isArray(res.resp)?res.resp:[];applyTheme();draw();notify("تم تحديث البيانات من Google Sheets")}
  }catch(e){notify("تعذر التحديث",true)}
}
function resetCourseConfirm(){
  openConfirm("بدء دورة جديدة","سيتم تفريغ بيانات الدورة الحالية لبدء دورة جديدة. الاستمارات السابقة تبقى محفوظة في الأرشيف، وبيانات هذه الدورة تبقى في قائمة «الدورات السابقة» لإعادة استخدامها.",()=>{upsertCourse();cfg.course=blankC();saveCfg();draw()});
}
async function changeAdminPass(){
  const cur=$("#pw-cur").value,nw=$("#pw-new").value,cnf=$("#pw-cnf").value,err=$("#pw-err");
  err.textContent="";
  if(!cur||!nw||!cnf){err.textContent="يرجى تعبئة جميع الحقول";return}
  if(nw.length<4){err.textContent="كلمة المرور الجديدة يجب أن تكون 4 أحرف على الأقل";return}
  if(nw!==cnf){err.textContent="كلمة المرور الجديدة وتأكيدها غير متطابقين";return}
  const u=getGasUrl();
  if(u){
    try{
      const res=await gasPost({action:"changePassword",password:cur,newPassword:nw});
      if(!res.ok){err.textContent=res.error||"كلمة المرور الحالية غير صحيحة";return}
      adminPass=nw;SS.s("ce_apw",nw);
      $("#pw-cur").value="";$("#pw-new").value="";$("#pw-cnf").value="";
      notify("تم تغيير كلمة المرور وحفظها في Google Sheets بنجاح");
    }catch(e){err.textContent="تعذر الاتصال بـ Google Sheets: "+(e.message||e)}
  }else{
    const savedPw=LS.g("ce_local_pw")||LOCAL_DEFAULT_PASS;
    if(cur!==savedPw){err.textContent="كلمة المرور الحالية غير صحيحة";return}
    LS.s("ce_local_pw",nw);adminPass=nw;SS.s("ce_apw",nw);
    $("#pw-cur").value="";$("#pw-new").value="";$("#pw-cnf").value="";
    notify("تم تغيير كلمة المرور محلياً بنجاح");
  }
}

const CF=["name","nameEn","trainer","trainerEn","hours","place","f1","f2","f3"];

function upsertCourse(){const c=cfg.course;if(!c||!String(c.name||"").trim())return;

function libList(){const m=new Map();(cfg.courses||[]).forEach(c=>m.set(c.name,c));
  live().slice().sort((a,b)=>b.ts-a.ts).forEach(r=>{const c=rc(r);if(c.name&&!m.has(c.name))m.set(c.name,{...pickC(c),lastFrom:c.from||"",lastTo:c.to||""})});

function mv(n,d){const m=n+d;if(m<0||m>=cfg.items.length)return;[cfg.items[n],cfg.items[m]]=[cfg.items[m],cfg.items[n]];saveCfg();draw()}

    return;
  }
  let r=resp.find(x=>x.id==id)||(mine&&mine.id==id?mine:null);
  if(!r&&getGasUrl()){
    $("#app").innerHTML='<div class="card m">جارٍ تحميل الشهادة…</div>';
    try{const res=await gasGet({action:"getCert",id});if(res.ok&&res.rec){r=res.rec;resp.push(r)}}catch(e){}

}

    const fc2=document.createElement("canvas");fc2.width=1200;fc2.height=48;const x=fc2.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,1200,48);x.fillStyle="#7a6a70";x.font="24px Tahoma,Arial";x.textAlign="center";x.textBaseline="middle";x.fillText([cfg.form.code,cfg.form.date,cfg.form.rev].join("      "),600,24);const fi2=fc2.toDataURL("image/png");
